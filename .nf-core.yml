repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-rnaseqprokaryotes_logo_light.png
    - docs/images/nf-core-rnaseqprokaryotes_logo_light.png
    - docs/images/nf-core-rnaseqprokaryotes_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - docs/CONTRIBUTING.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-rnaseqprokaryotes_logo_light.png
    - docs/images/nf-core-rnaseqprokaryotes_logo_light.png
    - docs/images/nf-core-rnaseqprokaryotes_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - .github/workflows/branch.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
  readme:
    - nextflow_badge
    - nfcore_template_badge

template:
  org: trestlebiosciences
  name: rnaseqprokaryotes
  description: RNA-seq oriented towards prokaryotes
  author: '@bradfordwinkelman'
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github_badges
    - ci
    - igenomes
    - seqera_platform
    - gpu
    - codespaces
    - rocrate
  is_nfcore: false
